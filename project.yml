name: CompileConquer
options:
  bundleIdPrefix: com.mangomods
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Never edit these by hand. CI stamps MARKETING_VERSION=0.1.<run> and
    # CURRENT_PROJECT_VERSION=<run> on every build (see .github/workflows/build.yml).
    MARKETING_VERSION: "0.0.0"
    CURRENT_PROJECT_VERSION: "0"
targets:
  CompileConquer:
    type: application
    platform: iOS
    sources:
      - path: CompileConquer
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: "Compile & Conquer"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        CADisableMinimumFrameDurationOnPhone: true
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationLandscapeLeft
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationLandscapeLeft
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mangomods.compileconquer
        PRODUCT_NAME: CompileConquer
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        ENABLE_BITCODE: NO
